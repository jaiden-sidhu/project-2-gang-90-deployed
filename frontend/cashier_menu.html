<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cashier Interface</title>
    <link rel="stylesheet" href="cashier.css">
    <script>
        function updateTime() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            var timeStr = hours + ':' + minutes + ' ' + ampm;
            document.getElementById("datetime").textContent = timeStr;
        }
        setInterval(updateTime, 1000);
        window.onload = updateTime;
    </script>
</head>
<body>
<div class="top-bar">
    <h1>Cashier Interface</h1>
    <div class="datetime" id="datetime"></div>
</div>

    <div class="main-container">
        <div class="sidebar">
        <div>
            <div class="menu-title">Main Menu</div>
            <hr>
            <div class="menu-item">Cashier Login</div>
        </div>
        <div class="menu-item">Settings</div>
        </div>

        <div class="drink-menu">
            <h1 class="drink-category-header">Milky Drinks</h1>
            <div class="drink-category">
                <button class="drink-button">Regular Pearl Milk Tea</button>
                <button class="drink-button">Honey Pearl Milk Tea</button>
                <button class="drink-button">Mango Green Milk Tea</button>
                <button class="drink-button">Thai Pearl Milk Tea</button>
                <button class="drink-button">Coconut Pearl Milk Tea</button>
            </div>

            <h1 class="drink-category-header">Fruity Drinks</h1>
            <div class="drink-category">
                <button class="drink-button">Mango Green Tea</button>
                <button class="drink-button">Passion Chess Tea</button>
                <button class="drink-button">Berry Lychee Tea</button>
                <button class="drink-button">Peach Tea</button>
                <button class="drink-button">Honey Lemonade Tea</button>
            </div>

            <h1 class="drink-category-header">Matcha Drinks</h1>
            <div class="drink-category">
                <button class="drink-button">Matcha Pearl Milk Tea</button>
                <button class="drink-button">Regular Matcha Fresh Milk</button>
                <button class="drink-button">Strawberry Matcha Fresh Milk</button>
                <button class="drink-button">Mango Matcha Fresh Milk</button>
                <button class="drink-button">Ice Blended Matcha</button>
            </div>

            <h1 class="drink-category-header">Ice-Blended Drinks</h1>
            <div class="drink-category">
                <button class="drink-button">Oreo with Pearls</button>
                <button class="drink-button">Taro with Pudding</button>
                <button class="drink-button">Thai Tea with Pearls</button>
                <button class="drink-button">Mango with Ice Cream</button>
                <button class="drink-button">Peach Tea with Lychee Jelly</button>
            </div>
        </div>

        <div class="order-panel">
            <div class="order-title">Current Order</div>
            <div class="order-item">
                <div class="order-row">
                <span></span>
                <span></span>
                </div>
                <div class="order-options">
                <div></div>
                <div></div>
            </div>
        </div>

        <div class="order-summary">
            <div class="summary-row">
            <span>Subtotal:</span>
            <span>$0.00</span>
            </div>
            <div class="summary-row">
            <span>Taxes:</span>
            <span>$0.00</span>
            </div>
            <button class="charge-btn">Charge $0.00</button>
        </div>
        </div>

    </div>
</body>
</html>
